apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: 
  name: frontend-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/RibunLoc/DevOps-work-management-web-platform.git
    targetRevision: develop
    path: k8s-deployment/frontend
    plugin:
      name: argocd-vault-plugin
    destination:
      server: https://kubernetes.default.svc
    syncPolicy:
      automated:
        prune: true
        selfHeal: true