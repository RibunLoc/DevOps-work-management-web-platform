apiVersion: apps/v1
kind: Deployment
metadata:
  name: octaltask-web-front
  labels:
    app: web-frontend
spec:
  replicas: 1
  selector: 
    matchLabels:
      app: web-frontend
  template:
    metadata:
      labels:
        app: web-frontend
    spec:
      containers:
        - name: frontend-container
          image: ribun/TaskManagement_Frontend:v1.0
          ports:
            - containerPort: 80
          env:
            - name: VITE_API_BASE
              valueFrom:
                configMapKeyRef:
                  name: frontend-config
                  key: VITE_API_BASE
