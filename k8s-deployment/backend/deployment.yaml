apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway-service
  template:
    metadata:
      labels:
        app: api-gateway-service
    spec:
      containers:
        - name: api-gateway-container
          image: ribun/task-management-api-gateway:v1.0
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: backend-config

