services:
  api-gateway:
    # build:
    #   context: .
    #   args:
    #     SERVICE: api-gateway
    #     PORT: ${SERVER_PORT}
    image: ribun/task-management-product-api-gateway:v3.0-20250624-152959
    container_name: api-gateway
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    env_file:
      - .env
    networks:
      - internal

  auth-service:
    # build:
    #   context: .
    #   args:
    #     SERVICE: auth-service
    #     PORT: ${AUTH_PORT}
    image: ribun/task-management-product-auth-service:v3.0-20250624-152959
    container_name: auth-service
    ports:
      - "${AUTH_PORT}:${AUTH_PORT}"
    env_file:
      - .env
    depends_on:
      - api-gateway
    networks:
      - internal

  task-service:
    # build:
    #   context: .
    #   args:
    #     SERVICE: task-service
    #     PORT: ${TASK_PORT}
    image: ribun/task-management-product-task-service:v3.0-20250622-150302
    container_name: task-service
    ports:
      - "${TASK_PORT}:${TASK_PORT}"
    env_file:
      - .env
    depends_on:
      - auth-service
    networks:
      - internal
    
  user-service:
    # build:
    #   context: .
    #   args:
    #     SERVICE: user-service
    #     PORT: ${USER_PORT}
    image:  ribun/task-management-product-user-service:v3.0-20250622-150931
    container_name: user-service
    ports:
      - "${USER_PORT}:${USER_PORT}"
    env_file:
      - .env
    depends_on:
      - api-gateway
    networks:
      - internal
networks:
  internal:
